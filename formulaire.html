  textarea {

  .error-text {

  <main>
    <div class="contact-wrapper">
      <div class="contact-card">
        <h1>Me contacter</h1>
        <form id="contactForm" novalidate>
          <label for="name">Nom</label>
          <input type="text" id="name" name="name" required>
          <span class="error-text" id="nameError">Merci d'indiquer votre nom.</span>
 
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
          <span class="error-text" id="emailError">Merci d'indiquer un email valide.</span>
 
          <label for="message">Message</label>
          <textarea id="message" name="message" required></textarea>
          <span class="error-text" id="messageError">Merci d'écrire un message.</span>
 
          <!-- Piège à robots (anti-spam), doit rester vide et invisible -->
          <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off">
 
          <button type="submit" id="submitBtn">Envoyer</button>
          <div class="msg" id="formMsg"></div>
        </form>
      </div>
    </div>
  </main>
 
<script>
// Remplacez cette URL par la vôtre, obtenue gratuitement sur https://formspree.io
// (créez un compte, un formulaire, et copiez l'URL "endpoint" fournie)
const FORM_ENDPOINT = "https://formspree.io/f/xljezoko";
 
const form = document.getElementById('contactForm');
const submitBtn = document.getElementById('submitBtn');
const formMsg = document.getElementById('formMsg');
 
function showFieldError(fieldId, show) {
  document.getElementById(fieldId + 'Error').style.display = show ? 'block' : 'none';
}
 
function validate() {
  let valid = true;
  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const message = document.getElementById('message').value.trim();
  const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
 
  showFieldError('name', name === '');
  if (name === '') valid = false;
 
  showFieldError('email', !emailPattern.test(email));
  if (!emailPattern.test(email)) valid = false;
 
  showFieldError('message', message === '');
  if (message === '') valid = false;
 
  return valid;
}
 
form.addEventListener('submit', async function (e) {
  e.preventDefault();
  formMsg.className = 'msg';
  formMsg.textContent = '';
 
  if (!validate()) return;
 
  submitBtn.disabled = true;
  submitBtn.textContent = 'Envoi en cours...';
 
  try {
    const response = await fetch(FORM_ENDPOINT, {
      method: 'POST',
      headers: { 'Accept': 'application/json' },
      body: new FormData(form)
    });
 
    if (response.ok) {
      formMsg.className = 'msg success';
      formMsg.textContent = 'Merci, votre message a bien été envoyé !';
      form.reset();
    } else {
      throw new Error('Erreur serveur');
    }
  } catch (err) {
    formMsg.className = 'msg error';
    formMsg.textContent = "Une erreur est survenue. Merci de réessayer, ou de m'écrire directement par email.";
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Envoyer';
  }
});
</script>
